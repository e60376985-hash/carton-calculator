<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>কার্টন ক্যালকুলেটর</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5fc; --bg-2:#e9edfb;
  --surface:#ffffff; --surface-2:#f5f7fd;
  --text:#0d1120; --text-2:#3b4258; --muted:#7b849c;
  --line:#e7eaf4; --line-2:#d7dcec;
  --field:#f5f7fd;
  --brand:#6366f1; --brand-2:#a855f7;
  --brand-soft:#eceaff; --brand-ink:#4f46e5;
  --green:#0ea5a3; --amber:#e08b0b; --danger:#e5484d;
  --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#a855f7 100%);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 10px 30px -18px rgba(35,42,80,.35),0 2px 6px rgba(16,24,40,.04);
  --shadow-brand:0 14px 30px -14px rgba(99,102,241,.6);
  --r-sm:12px; --r:16px; --r-lg:22px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#080a12; --bg-2:#0b0f19;
    --surface:#11151f; --surface-2:#171c28;
    --text:#eef1f8; --text-2:#c4cbdb; --muted:#8a93a8;
    --line:#1e2431; --line-2:#2a3141;
    --field:#0d121b;
    --brand:#818cf8; --brand-2:#c084fc;
    --brand-soft:#1b1f3a; --brand-ink:#a5b4fc;
    --green:#2dd4bf; --amber:#fbbf24; --danger:#f87171;
    --shadow-sm:0 1px 2px rgba(0,0,0,.45);
    --shadow:0 10px 30px -18px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.45);
    --shadow-brand:0 14px 30px -14px rgba(99,102,241,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#080a12; --bg-2:#0b0f19;
  --surface:#11151f; --surface-2:#171c28;
  --text:#eef1f8; --text-2:#c4cbdb; --muted:#8a93a8;
  --line:#1e2431; --line-2:#2a3141;
  --field:#0d121b;
  --brand:#818cf8; --brand-2:#c084fc;
  --brand-soft:#1b1f3a; --brand-ink:#a5b4fc;
  --green:#2dd4bf; --amber:#fbbf24; --danger:#f87171;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow:0 10px 30px -18px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.45);
  --shadow-brand:0 14px 30px -14px rgba(99,102,241,.55);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:20px}
body{
  margin:0;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  max-width:620px;margin-inline:auto;
  padding:18px 16px calc(122px + env(safe-area-inset-bottom,0px));
  padding-top:calc(18px + env(safe-area-inset-top,0px));
  -webkit-font-smoothing:antialiased;
  transition: overflow 0.3s;
}
body.modal-open { overflow: hidden; }

/* soft background blobs */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.blobs span:nth-child(1){width:330px;height:330px;background:#c7d2fe;top:-130px;right:-100px}
.blobs span:nth-child(2){width:300px;height:300px;background:#ddd6fe;top:36%;left:-140px}
.blobs span:nth-child(3){width:280px;height:280px;background:#bae6fd;bottom:-110px;right:-80px}
:root[data-theme="dark"] .blobs span{opacity:.16}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .blobs span{opacity:.16}
}
/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:46px;height:46px;flex-shrink:0;border-radius:16px;
  background:var(--grad);display:grid;place-items:center;font-size:22px;
  box-shadow:var(--shadow-brand);
}
h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.02em}
.sub{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.header-actions{display:flex;gap:8px;}
.icon-btn{
  width:42px;height:42px;flex-shrink:0;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);
  color:var(--text-2);font-size:17px;cursor:pointer;
  display:grid;place-items:center;box-shadow:var(--shadow-sm);
  transition:all .15s;
}
.icon-btn:hover{color:var(--brand);border-color:var(--brand)}
.icon-btn:active{transform:scale(.94)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-sm)}

/* summary */
.sum-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sum-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.live{
  display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
  font-size:11px;font-weight:700;color:var(--brand-ink);
  background:var(--brand-soft);padding:4px 10px;border-radius:999px;
}
.live i{width:6px;height:6px;border-radius:50%;background:var(--brand);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* Top 3 stats in one line */
.top-stats{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:8px;
  margin-bottom:20px;
}
.stat-box{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:12px 6px;
  text-align:center;
  transition:all 0.2s ease;
  position:relative;
  overflow:hidden;
  animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}
.stat-box:nth-child(1) { animation-delay: 0.05s; }
.stat-box:nth-child(2) { animation-delay: 0.1s; }
.stat-box:nth-child(3) { animation-delay: 0.15s; }

.stat-box:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-sm);
  border-color:var(--line-2);
}
.stat-box .s-val{
  font-size:24px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  line-height:1.1;
  letter-spacing:-.02em;
  transition: all 0.2s ease;
}
.stat-box .s-lbl{
  font-size:11px;
  color:var(--muted);
  font-weight:600;
  margin-top:4px;
}
.stat-box.total .s-val{color:var(--brand-ink)}
.stat-box.pack .s-val{color:var(--green)}
.stat-box.rem .s-val{color:var(--amber)}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes flashNum {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
.num-flash { animation: flashNum 0.3s ease-out; display: inline-block; }

/* Table redesign */
.sum-list{
  margin-top:4px;
  border-radius:var(--r);
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--line);
}
.sm{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1fr;
  gap:4px;
  align-items:center;
  padding:12px 8px;
  text-align:center;
  border-bottom:1px solid var(--line);
  font-size:14px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  transition:background 0.2s;
  animation: slideUpRow 0.3s ease backwards;
}
.sm:hover:not(.head){background:var(--surface-2)}
.sm:last-child{border-bottom:0}
.sm>span:first-child{
  text-align:left;
  font-weight:700;
  color:var(--text);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  padding-left:8px;
}
.sm.head{
  font-size:10.5px;
  font-weight:700;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
  padding:10px 8px;
  background:var(--surface-2);
  border-bottom:1px solid var(--line);
  animation:none;
}
.sm.head>span:first-child{padding-left:8px}
.v-green{color:var(--green)}
.v-brand{color:var(--brand-ink)}
.v-amber{color:var(--amber)}
#sum:empty::after{
  content:'কোনো সাইজ নেই';display:block;text-align:center;
  padding:24px;font-size:12px;color:var(--muted);
}
@keyframes slideUpRow {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* section title */
.sec{
  display:flex;align-items:center;gap:8px;
  margin:22px 4px 10px;font-size:12px;font-weight:700;
  color:var(--muted);letter-spacing:.04em;
}
.sec::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--grad)}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}

/* Updated settings layout */
.settings{display:flex; flex-direction:column; gap:10px;}
.settings-row{display:grid; gap:6px;}
.row-1 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.row-2 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.field{display:flex; flex-direction:column; min-width:0;}
.field input{
  width:100%;height:48px;font-size:13px;font-family:inherit; font-weight:600;
  padding:0 4px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--field);color:var(--text); 
  text-align: center; 
  text-transform: uppercase; 
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.field input::placeholder{color:var(--muted);opacity:.8;font-weight:500; text-transform: uppercase;}
.field input:focus{
  outline:none;border-color:var(--brand);background:var(--surface);
  box-shadow:0 0 0 4px var(--brand-soft);
}
.field.per input { padding: 0 2px; font-weight:700; font-size:14px;} 
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* size card */
.size-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:14px;margin-bottom:10px;
  box-shadow:var(--shadow-sm);animation:pop .18s ease;
}
@keyframes pop{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

.sc-head {
  display: grid;
  grid-template-columns: 48px 64px 1fr 36px;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}

.nm {
  width: 100%; height: 46px; text-align: center;
  font-size: 15px; font-weight: 800; font-family: inherit;
  background: var(--surface-2); color: var(--text);
  border: 1.5px solid var(--line); border-radius: var(--r-sm);
  pointer-events: none;
  text-transform: uppercase;
}

.per-input {
  width: 100%; height: 46px; text-align: center;
  font-size: 13px; font-weight: 700; font-family: inherit;
  padding: 0 2px;
  border: 1.5px solid var(--line); border-radius: var(--r-sm);
  background: var(--field); color: var(--text); transition: all .15s;
}
.qty-input {
  width: 100%; height: 46px; text-align: center;
  font-size: 16px; font-weight: 700; font-family: inherit;
  padding: 0 8px;
  border: 1.5px solid var(--line); border-radius: var(--r-sm);
  background: var(--field); color: var(--text); transition: all .15s;
  text-transform: uppercase;
}

.per-input:focus, .qty-input:focus {
  outline: none; border-color: var(--brand); background: var(--surface);
  box-shadow: 0 0 0 4px var(--brand-soft);
}

.sc-del {
  width: 36px; height: 38px; flex-shrink: 0; padding: 0;
  border: 0; border-radius: 11px; background: transparent;
  color: var(--muted); font-size: 15px; cursor: pointer;
  display: grid; place-items: center; transition: all .15s;
}
.sc-del:hover { background: rgba(229,72,77,.12); color: var(--danger); }

.sc-res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.res-tile{
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:8px 2px;text-align:center;
}
.res-tile span{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:2px}
.res-tile b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.res-tile.total b{color:var(--text)}
.res-tile.box b{color:var(--green)}
.res-tile.pack b{color:var(--brand-ink)}
.res-tile.left b{color:var(--amber)}
.sc-bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.sc-bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--grad);transition:width .3s ease}

/* empty sizes */
.empty-box{
  color:var(--muted);font-size:13px;text-align:center;padding:26px 16px;
  background:var(--surface);border:1.5px dashed var(--line-2);
  border-radius:var(--r-lg);
}
/* action bar */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  pointer-events:none;
}
.actionbar-inner{
  pointer-events:auto;max-width:620px;margin:0 auto;
  display:flex;gap:8px;padding:8px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:46px;padding:0 16px;font-size:14px;font-weight:700;font-family:inherit;
  border-radius:14px;border:1px solid var(--line);
  background:var(--surface);color:var(--text-2);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.btn:hover{border-color:var(--line-2);color:var(--text)}
.btn:active{transform:scale(.97)}
.btn-add{flex:1;background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.btn-add:hover{background:var(--brand);color:#fff}
.btn-icon{width:46px;padding:0;font-size:18px}
.btn-grad{flex:1.4;background:var(--grad);color:#fff;border:0;box-shadow:var(--shadow-brand)}
.btn-grad:hover{filter:brightness(1.07)}
.btn svg{width:16px;height:16px;flex-shrink:0}
/* history */
.rc{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--shadow-sm);margin-bottom:10px;
}
.rh{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:11px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(135deg,var(--brand-soft) 0%,transparent 85%);
}
.rh-num{
  background:var(--grad);color:#fff;padding:3px 10px;border-radius:9px;
  font-weight:800;font-size:11.5px;font-variant-numeric:tabular-nums;
}
.rh-date{flex:1;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn-sm{
  height:30px;padding:0 10px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);
  color:var(--text-2);font-size:11.5px;font-weight:600;
  font-family:inherit;cursor:pointer;flex-shrink:0;transition:all .15s;
}
.btn-sm:hover{border-color:var(--brand);color:var(--brand)}
.btn-sm.danger:hover{border-color:rgba(229,72,77,.45);color:var(--danger);background:rgba(229,72,77,.08)}

/* Adjusted chips for one-line fit */
.rh-chips{
  display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;
  border-bottom:1px solid var(--line);
  align-items: center;
}
.chip{
  display:inline-flex;align-items:center;padding:4px 9px;border-radius:7px;
  font-size:11px;font-weight:600; white-space:nowrap; text-transform: uppercase;
  background:var(--surface-2);color:var(--text-2);border:1px solid var(--line);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.chip b{color:var(--text);margin-left:4px;font-weight:800;}
.chip.color-chip{
  background:rgba(224,139,11,.12);color:var(--amber);
  border-color:rgba(224,139,11,.28);
}

.rt{width:100%;border-collapse:collapse;text-align:center;font-variant-numeric:tabular-nums}
.rt th{
  font-size:10px;font-weight:600;color:var(--muted);
  padding:8px 4px;text-transform:uppercase;letter-spacing:.05em;
  border-bottom:1px solid var(--line);
}
.rt td{padding:8px 4px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line); text-transform: uppercase;}
.rt td:first-child,.rt th:first-child{text-align:left;padding-left:14px}
.rt tbody tr:last-child td{border-bottom:0}
.rt tr.tt td{
  font-weight:800;font-size:13.5px;background:var(--surface-2);
  color:var(--text);border-top:1px solid var(--line-2);
}
/* history empty */
.emp{
  color:var(--muted);font-size:13px;text-align:center;padding:32px 20px;
  background:var(--surface);border:1.5px dashed var(--line-2);border-radius:var(--r-lg);
}
.emp-icon{font-size:28px;display:block;margin-bottom:6px;opacity:.6}

/* --- Modal / Report Styles --- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  z-index: 100; display: none; align-items: center; justify-content: center;
  padding: 16px;
}
.modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
.modal-content {
  background: var(--surface); border-radius: var(--r-lg);
  width: 100%; max-width: 600px; max-height: 90vh;
  display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  animation: slideUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUpModal { from { opacity: 0; transform: translateY(40px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

.modal-header {
  padding: 16px 20px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface);
}
.modal-title { font-size: 18px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 8px;}
.modal-close {
  background: none; border: none; font-size: 20px; color: var(--muted);
  cursor: pointer; padding: 6px; border-radius: 50%; transition: 0.2s;
  display: grid; place-items: center;
}
.modal-close:hover { background: var(--surface-2); color: var(--danger); transform: rotate(90deg); }

/* --- Toolbar Single Line Update --- */
.modal-toolbar {
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  display: flex; gap: 8px; align-items: center; flex-wrap: nowrap;
  background: var(--surface-2);
}
.date-select {
  padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font-family: inherit;
  font-weight: 700; outline: none; flex: 1; min-width: 100px; font-size: 14px;
}
.btn-instant {
  height: 34px; padding: 0 16px; border-radius: 8px; border: none;
  background: var(--brand); color: #fff; font-family: inherit;
  font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s;
  white-space: nowrap; flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(99,102,241,0.3);
}
.btn-instant:hover { background: var(--brand-ink); }
.toggle-wrap {
  display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
  color: var(--text-2); background: var(--surface); padding: 5px 10px;
  border-radius: 8px; border: 1px solid var(--line); flex-shrink: 0;
}
.toggle-wrap input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--brand); cursor: pointer; }
.toggle-wrap input[type="time"] {
  border: none; background: transparent; color: var(--text);
  font-family: inherit; font-size: 12px; font-weight: 700; outline: none; padding: 0; width: 70px;
}

.modal-body {
  padding: 20px; overflow-y: auto; flex: 1; background: var(--bg);
}

/* --- New Combined Report Header Bar --- */
.report-header-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--surface); padding: 12px 16px; border-radius: 12px;
  margin-bottom: 16px; border: 1px solid var(--line); box-shadow: var(--shadow-sm);
}
.report-date-wrap {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.report-date-title {
  font-size: 15px; font-weight: 800; color: var(--brand-ink);
  display: flex; align-items: center; gap: 6px;
}
.report-time-small {
  font-size: 11.5px; font-weight: 600; color: var(--muted);
  background: var(--surface-2); padding: 3px 8px; border-radius: 6px;
}
.btn-report-del {
  background: rgba(229,72,77,.1); border: 1px solid rgba(229,72,77,.2);
  color: var(--danger); padding: 6px 12px; border-radius: 8px;
  font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s;
  display: flex; align-items: center; gap: 4px; flex-shrink: 0;
}

<script>
var S=['S','M','L','XL','XXL'].map(function(n){return {n:n,per:'',q:''}});
var $=function(i){return document.getElementById(i)};
function num(x){var n=parseInt(x,10);return isNaN(n)||n<0?0:n}

function esc(x){
  return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function calc(s){
  var per = num(s.per) || num($('per').value) || 12; 
  var arr = String(s.q).split(',').map(function(x){ return num(x); });
  var t = arr.reduce(function(a,b){ return a+b; }, 0);
  
  var c = per ? Math.floor(t/per) : 0;
  return {t:t, c:c, p:c*per, r:t-c*per};
}

function render(){
  if(!S.length){
    $('sizes').innerHTML='<div class="empty-box">কোনো সাইজ নেই · নিচের “সাইজ যোগ” বাটনে চাপ দিন</div>';
    upd();return;
  }
  var h='';
  S.forEach(function(s,k){
    h+='<div class="size-card">'
     
     +'<div class="sc-head">'
     +'<input class="nm" value="'+esc(s.n)+'" readonly title="'+esc(s.n)+'" aria-label="সাইজের নাম">'
     +'<input type="number" class="per-input" inputmode="numeric" min="1" data-k="'+k+'" data-f="per" value="'+esc(s.per)+'" placeholder="1-CTN" aria-label="কার্টনে পিচ">'
     +'<input type="text" class="qty-input" inputmode="numeric" data-k="'+k+'" data-f="q" value="'+esc(s.q)+'" placeholder="GMTS-CTN" aria-label="কন্টিটি">'
     +'<button class="sc-del" data-del="'+k+'" type="button" aria-label="মুছুন">✕</button>'
     +'</div>'
     
     +'<div class="sc-res">'
     +'<div class="res-tile total"><span>মোট</span><b id="t'+k+'">0</b></div>'
     +'<div class="res-tile box"><span>কার্টন</span><b id="c'+k+'">0</b></div>'
     +'<div class="res-tile pack"><span>প্যাক</span><b id="p'+k+'">0</b></div>'
     +'<div class="res-tile left"><span>অবশিষ্ট</span><b id="r'+k+'">0</b></div>'
     +'</div>'
     +'<div class="sc-bar"><i id="b'+k+'"></i></div>'
     +'</div>';
  });
  $('sizes').innerHTML=h;
  upd();
}

function upd(){
  var g={t:0,c:0,p:0,r:0},rows='';
  S.forEach(function(s,k){
    var r=calc(s);
    var e;
    e=$('t'+k);if(e)e.textContent=r.t;
    e=$('c'+k);if(e)e.textContent=r.c;
    e=$('p'+k);if(e)e.textContent=r.p;
    e=$('r'+k);if(e)e.textContent=r.r;
    e=$('b'+k);if(e)e.style.width=(r.t?(r.p/r.t*100):0)+'%';
    g.t+=r.t;g.c+=r.c;g.p+=r.p;g.r+=r.r;
    
    var delay = (k * 0.05).toFixed(2) + 's';
    rows+='<div class="sm" style="animation-delay:'+delay+'"><span>'+esc(s.n||'—')+'</span>'
        +'<span class="v-green">'+r.c+'</span>'
        +'<span class="v-brand">'+r.p+'</span>'
        +'<span class="v-amber">'+r.r+'</span></div>';
  });
  $('sum').innerHTML=rows;
  
  var updateVal = function(id, val) {
    var el = $(id);
    if (el.textContent != val) {
      el.textContent = val;
      el.classList.remove('num-flash');
      void el.offsetWidth;
      el.classList.add('num-flash');
    }
  };
  
  updateVal('gc', g.c);
  updateVal('gp', g.p);
  updateVal('gr', g.r);
}

$('sizes').addEventListener('input',function(e){
  var d=e.target.dataset,s=S[d.k];if(!s)return;
  if(d.f)s[d.f]=e.target.value;
  upd();
  saveDraft(); 
});

$('sizes').addEventListener('click',function(e){
  var b=e.target.closest('[data-del]');if(!b)return;
  S.splice(+b.dataset.del,1);render();
  saveDraft();
});

$('per').addEventListener('input',function(){
  upd();
  saveDraft();
});

$('add').onclick=function(){
  var n=prompt('নতুন সাইজের নাম দিন (যেমন: 3XL, 4XL):');
  if(n && n.trim()){
    S.push({n:n.trim().toUpperCase(),per:'',q:''});
    render();
    saveDraft();
  }
};

$('clr').onclick=function(){
  S.forEach(function(s){s.q='';s.per=''});
  render();
  saveDraft();
};

/* ---------- Enter Key Navigation ---------- */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var active = document.activeElement;
    if (active && active.tagName === 'INPUT' && active.type !== 'time') {
      e.preventDefault(); 
      var inputs = Array.from(document.querySelectorAll('input:not([readonly]):not([disabled]):not([type="hidden"]):not([type="time"])'));
      var index = inputs.indexOf(active);
      if (index > -1 && index < inputs.length - 1) {
        inputs[index + 1].focus();
      } else {
        active.blur();
      }
    }
  }
});

/* ---------- storage & draft ---------- */
var KEY='carton_records_v19',H=[];
var DRAFT_KEY='carton_draft_v3';
var REPORT_KEY='carton_reports_v1', REPORTS=[];
var AUTO_REPORT_KEY='carton_auto_report', autoReportEnabled = true;
var AUTO_TIME_KEY='carton_auto_time', autoReportTime = '18:50';

function loadH(){try{H=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){H=[]}}
function saveH(){try{localStorage.setItem(KEY,JSON.stringify(H));return true}catch(e){return false}}
function pad(n){return n<10?'0'+n:''+n}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmt(d){var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function flash(b,t,o){b.textContent=t;setTimeout(function(){b.textContent=o},1600)}

function saveDraft() {
  var draft = {
    sty: $('sty').value, po: $('po').value, ord: $('ord').value,
    per: $('per').value, col: $('col').value, buyer: $('buyer').value,
    country: $('country').value, sizes: S
  };
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch(e) {}
}

function loadDraft() {
  try {
    var d = JSON.parse(localStorage.getItem(DRAFT_KEY));
    if (d) {
      $('sty').value = d.sty || ''; $('po').value = d.po || ''; $('ord').value = d.ord || '';
      $('per').value = d.per || ''; $('col').value = d.col || ''; $('buyer').value = d.buyer || '';
      $('country').value = d.country || '';
      if (d.sizes && Array.isArray(d.sizes) && d.sizes.length > 0) { S = d.sizes; }
    }
  } catch(e) {}
}

['sty','po','ord','per','col','buyer','country'].forEach(function(id){
  $(id).addEventListener('input', saveDraft);
});

/* ---------- History & Report Logic ---------- */
function txt(h){
  var s='Serial #'+h.serial+' | '+fmt(h.date)+' '+h.time+'\n'
   +(h.sty?'Style: '+h.sty+'\n':'')+(h.po?'PO: '+h.po+'\n':'')
   +(h.ord?'OP: '+h.ord+'\n':'')+(h.color?'Color: '+h.color+'\n':'')
   +(h.buyer?'Buyer: '+h.buyer+'\n':'')+(h.country?'Country: '+h.country+'\n':'');
  h.rows.forEach(function(r){s+=r.n+': Carton '+r.c+', Pack '+r.p+', Left '+r.r+'\n'});
  return s+'Total: Carton '+h.tot.c+', Pack '+h.tot.p+', Left '+h.tot.r;
}

function cp(t,b){
  function fb(){
    var a=document.createElement('textarea');a.value=t;
    document.body.appendChild(a);a.select();
    try{document.execCommand('copy');flash(b,'Copied ✓','Copy')}catch(e){}
    a.remove();
  }
  try{navigator.clipboard.writeText(t).then(function(){flash(b,'Copied ✓','Copy')},fb)}catch(e){fb()}
}

function renderH(){
  if(!H.length){
    $('hist').innerHTML='<div class="emp"><span class="emp-icon">📋</span>No records saved yet</div>';
    return;
  }
  $('hist').innerHTML=H.map(function(h,i){
    var chips='';
    if(h.sty)   chips+='<span class="chip">Style: <b>'+esc(h.sty)+'</b></span>';
    if(h.po)    chips+='<span class="chip">PO: <b>'+esc(h.po)+'</b></span>';
    if(h.ord)   chips+='<span class="chip">OP: <b>'+esc(h.ord)+'</b></span>';
    if(h.buyer) chips+='<span class="chip">Buyer: <b>'+esc(h.buyer)+'</b></span>';
    if(h.country) chips+='<span class="chip">Country: <b>'+esc(h.country)+'</b></span>';
    if(h.color) chips+='<span class="chip color-chip">● '+esc(h.color)+'</span>';

    var t='<table class="rt"><thead><tr><th>Size</th><th>Carton</th><th>Pack</th><th>Left</th></tr></thead><tbody>';
    h.rows.forEach(function(r){ t+='<tr><td>'+esc(r.n)+'</td><td>'+r.c+'</td><td>'+r.p+'</td><td>'+r.r+'</td></tr>'; });
    t+='<tr class="tt"><td>Total</td><td>'+h.tot.c+'</td><td>'+h.tot.p+'</td><td>'+h.tot.r+'</td></tr>';
    t+='</tbody></table>';

    return '<div class="rc" id="rc-'+i+'">'
      +'<div class="rh"><span class="rh-num">#'+h.serial+'</span><span class="rh-date">'+fmt(h.date)+' · '+h.time+'</span>'
      +'<button class="btn-sm" data-cp="'+i+'" type="button">Copy</button>'
      +'<button class="btn-sm" data-share="'+i+'" type="button">Share</button>'
      +'<button class="btn-sm danger" data-rm="'+i+'" type="button">Delete</button></div>'
      +(chips?'<div class="rh-chips">'+chips+'</div>':'')+t+'</div>';
  }).join('');
}

$('hist').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  var d=t.dataset;
  if(d.cp!==undefined) cp(txt(H[d.cp]),t);
  if(d.share!==undefined) generateAndShare(H[d.share], t); 
  if(d.rm!==undefined){
    if(t.textContent==='Delete'){flash(t,'Click again','Delete')}
    else{H.splice(+d.rm,1);saveH();renderH()}
  }
});

$('save').onclick=function(){
  var rows=[],g={c:0,p:0,r:0,t:0};
  S.forEach(function(s){
    var r=calc(s); rows.push({n:s.n||'-',t:r.t,c:r.c,p:r.p,r:r.r});
    g.c+=r.c;g.p+=r.p;g.r+=r.r;g.t+=r.t
  });
  if(!g.t){flash($('save'),'আগে সংখ্যা বসান','সেভ করুন');return}
  var d=today(),mx=0,n=new Date();
  H.forEach(function(h){if(h.date===d&&h.serial>mx)mx=h.serial});
  var rec={
    date:d,time:pad(n.getHours())+':'+pad(n.getMinutes()),serial:mx+1,
    per:num($('per').value) || 12,
    sty:$('sty').value.trim(), po:$('po').value.trim(), ord:$('ord').value.trim(),
    color:$('col').value.trim(), buyer:$('buyer').value.trim(), country:$('country').value.trim(),
    rows:rows,tot:g
  };
  H.unshift(rec);
  var ok=saveH();renderH();
  flash($('save'),ok?'সেভ ✓ #'+rec.serial:'সেভ হয়নি','সেভ করুন');
  $('hs').scrollIntoView({behavior:'smooth',block:'start'});
  
  checkAutoReport();
};

/* ---------- Auto Report & Modal Logic ---------- */
function loadReports(){
  try{ REPORTS = JSON.parse(localStorage.getItem(REPORT_KEY)||'[]') || []; }catch(e){ REPORTS=[]; }
  try{ 
    var savedAuto = localStorage.getItem(AUTO_REPORT_KEY);
    if (savedAuto !== null) autoReportEnabled = JSON.parse(savedAuto); 
    else autoReportEnabled = true; 
  }catch(e){ autoReportEnabled = true; }
  
  try {
    var savedTime = localStorage.getItem(AUTO_TIME_KEY);
    if(savedTime) autoReportTime = savedTime;
  } catch(e) {}
  
  $('auto-report-toggle').checked = autoReportEnabled;
  $('auto-report-time').value = autoReportTime;
}

function saveReports(){
  try{ localStorage.setItem(REPORT_KEY, JSON.stringify(REPORTS)); }catch(e){}
}

$('auto-report-toggle').addEventListener('change', function(e){
  autoReportEnabled = e.target.checked;
  try{ localStorage.setItem(AUTO_REPORT_KEY, JSON.stringify(autoReportEnabled)); }catch(e){}
  if(autoReportEnabled) checkAutoReport();
});

$('auto-report-time').addEventListener('change', function(e){
  autoReportTime = e.target.value;
  try{ localStorage.setItem(AUTO_TIME_KEY, autoReportTime); }catch(e){}
  if(autoReportEnabled) checkAutoReport();
});

function buildReportData(dateStr){
  var dayData = H.filter(function(h){ return h.date === dateStr; });
  if(!dayData.length) return null;

  var groups = {};
  dayData.forEach(function(h){
    var key = (h.sty || 'N/A') + '|' + (h.color || 'N/A');
    if(!groups[key]) groups[key] = { style: h.sty || 'N/A', color: h.color || 'N/A', sizes: {} };
    
    h.rows.forEach(function(r){
      if(!groups[key].sizes[r.n]) groups[key].sizes[r.n] = { p:0, c:0, pk:0 };
      groups[key].sizes[r.n].p += r.t;
      groups[key].sizes[r.n].c += r.c;
      groups[key].sizes[r.n].pk += r.p;
    });
  });

  var now = new Date();
  return { 
    date: dateStr, 
    generatedTime: pad(now.getHours()) + ':' + pad(now.getMinutes()), 
    groups: groups 
  };
}

function checkAutoReport(){
  if(!autoReportEnabled) return;
  
  var now = new Date();
  var currentTimeStr = pad(now.getHours()) + ':' + pad(now.getMinutes());
  var isPastAutoTime = currentTimeStr >= autoReportTime;
  
  var tDate = today();
  var todayExists = REPORTS.some(function(r){ return r.date === tDate; });
  if(isPastAutoTime && !todayExists){
    var data = buildReportData(tDate);
    if(data){
      REPORTS.unshift(data);
      saveReports();
      console.log("Auto report generated for today:", tDate);
    }
  }

  var uniqueDates = [...new Set(H.map(function(h){ return h.date; }))];
  var updated = false;
  uniqueDates.forEach(function(d){
    var exists = REPORTS.some(function(r){ return r.date === d; });
    if(!exists && d < tDate){ 
      var data = buildReportData(d);
      if(data){
        REPORTS.push(data);
        updated = true;
      }
    }
  });
  
  if(updated){
    REPORTS.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    saveReports();
    console.log("Missed reports generated.");
  }
}

function renderReportModal(dateStr){
  var report = REPORTS.find(function(r){ return r.date === dateStr; });
  var body = $('report-body');
  
  if(!report){
    body.innerHTML = '<div class="no-report-msg">এই তারিখে কোনো রিপোর্ট পাওয়া যায়নি।</div>';
    return;
  }

  var html = '';
  
  // Combined Header Bar with Date, Time, and Delete Button
  html += '<div class="report-header-bar">';
  html += '  <div class="report-date-wrap">';
  html += '    <div class="report-date-title">📅 ' + fmt(report.date) + '</div>';
  html += '    <div class="report-time-small">⏰ ' + (report.generatedTime || 'N/A') + '</div>';
  html += '  </div>';
  html += '  <button class="btn-report-del" data-del-date="' + report.date + '">🗑️ Delete</button>';
  html += '</div>';

  var styleKeys = Object.keys(report.groups);
  
  styleKeys.forEach(function(key){
    var g = report.groups[key];
    html += '<div class="report-group">';
    html += '<div class="report-group-header">';
    html += '<div class="report-group-title">STYLE: ' + esc(g.style) + '</div>';
    if(g.color && g.color !== 'N/A') {
       html += '<div class="report-color-badge">● ' + esc(g.color) + '</div>';
    }
    html += '</div>';
    
    // Removed PCS from Table Header
    html += '<table class="report-table"><thead><tr><th>Size</th><th>Carton</th><th>Pack</th></tr></thead><tbody>';
    var totC=0, totPk=0;
    Object.keys(g.sizes).forEach(function(sz){
      var sd = g.sizes[sz];
      totC+=sd.c; totPk+=sd.pk;
      // Removed PCS from Table Body
      html += '<tr><td>'+esc(sz)+'</td><td>'+sd.c+'</td><td>'+sd.pk+'</td></tr>';
    });
    // Removed PCS from Total Row
    html += '<tr class="total-row"><td>Total</td><td>'+totC+'</td><td>'+totPk+'</td></tr>';
    html += '</tbody></table></div>';
  });
  
  body.innerHTML = html;
}

function refreshReportDropdown() {
  var sel = $('report-date-select');
  sel.innerHTML = '';
  
  if(!REPORTS.length){
    $('report-body').innerHTML = '<div class="no-report-msg">এখনও কোনো রিপোর্ট তৈরি হয়নি।</div>';
    sel.innerHTML = '<option>No Reports</option>';
    return;
  }

  REPORTS.forEach(function(r){
    var opt = document.createElement('option');
    opt.value = r.date;
    opt.textContent = fmt(r.date);
    sel.appendChild(opt);
  });
}

function openReportModal(){
  loadReports();
  refreshReportDropdown();
  
  var sel = $('report-date-select');
  if(REPORTS.length > 0) {
    var tDate = today();
    var hasToday = REPORTS.some(function(r){ return r.date === tDate; });
    sel.value = hasToday ? tDate : REPORTS[0].date;
    renderReportModal(sel.value);
  }
  
  $('report-modal').classList.add('open');
  document.body.classList.add('modal-open'); 
}

function closeReportModal(){
  $('report-modal').classList.remove('open');
  document.body.classList.remove('modal-open'); 
}

$('report-btn').onclick = openReportModal;
$('close-report').onclick = closeReportModal;
$('report-modal').addEventListener('click', function(e){
  if(e.target === $('report-modal')) closeReportModal();
});

$('report-date-select').addEventListener('change', function(e){
  renderReportModal(e.target.value);
});

/* --- Instant Report Button Logic --- */
$('instant-report-btn').onclick = function(){
  var tDate = today();
  var data = buildReportData(tDate);
  
  if(!data) {
    alert('আজকের জন্য এখনও কোনো ডেটা সেভ করা হয়নি!');
    return;
  }
  
  REPORTS = REPORTS.filter(function(r){ return r.date !== tDate; });
  REPORTS.unshift(data);
  REPORTS.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  saveReports();
  
  refreshReportDropdown();
  $('report-date-select').value = tDate;
  renderReportModal(tDate);
  
  var btn = this;
  var oldTxt = btn.textContent;
  btn.textContent = '✓ Done';
  setTimeout(function(){ btn.textContent = oldTxt; }, 2000);
};

/* --- Delete Report Button Logic (Inside Report Body) --- */
var deleteState = false;
$('report-body').addEventListener('click', function(e) {
  var btn = e.target.closest('.btn-report-del');
  if(!btn) return;
  
  var dateStr = btn.getAttribute('data-del-date');
  if(!dateStr) return;
  
  if(!deleteState) {
    deleteState = true;
    btn.innerHTML = 'Sure?';
    btn.classList.add('confirming');
    setTimeout(function(){ 
      if(deleteState) {
        deleteState = false;
        btn.innerHTML = '🗑️ Delete';
        btn.classList.remove('confirming');
      }
    }, 3000);
  } else {
    // Execute Deletion
    REPORTS = REPORTS.filter(function(r){ return r.date !== dateStr; });
    saveReports();
    
    deleteState = false;
    refreshReportDropdown();
    
    if(REPORTS.length > 0) {
      $('report-date-select').value = REPORTS[0].date;
      renderReportModal(REPORTS[0].date);
    } else {
      $('report-date-select').value = 'No Reports';
      renderReportModal('');
    }
  }
});

/* --- Share Report as Image --- */
$('share-report').onclick = function(){
  var dateStr = $('report-date-select').value;
  if(!dateStr || dateStr === 'No Reports') return;
  
  var report = REPORTS.find(function(r){ return r.date === dateStr; });
  if(!report) return;
  
  var btn = this;
  var oldText = btn.innerHTML;
  btn.innerHTML = 'Generating...';
  btn.disabled = true;

  try {
    var width = 540; var pad = 16; var cardW = width - pad * 2;
    var groupsArr = Object.keys(report.groups).map(function(k){ return report.groups[k]; });
    
    var height = 160; 
    groupsArr.forEach(function(g){ height += 60 + (Object.keys(g.sizes).length * 40) + 50; }); 
    
    var canvas = document.createElement('canvas');
    var dpr = window.devicePixelRatio || 2;
    canvas.width = width * dpr; canvas.height = height * dpr;
    var ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);

    var style = getComputedStyle(document.body);
    var cBg = style.getPropertyValue('--bg').trim();
    var cSurface = style.getPropertyValue('--surface').trim();
    var cText = style.getPropertyValue('--text').trim();
    var cMuted = style.getPropertyValue('--muted').trim();
    var cLine = style.getPropertyValue('--line').trim();
    var cBrand = style.getPropertyValue('--brand-ink').trim();
    var cAmber = style.getPropertyValue('--amber').trim();
    var cGreen = style.getPropertyValue('--green').trim();

    ctx.fillStyle = cBg; ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = cSurface; 
    if(ctx.roundRect) { ctx.beginPath(); ctx.roundRect(pad, pad, cardW, height - pad*2, 20); ctx.fill(); } 
    else ctx.fillRect(pad, pad, cardW, height - pad*2);

    var curY = pad + 40;
    ctx.fillStyle = cText; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('Daily Production Report', pad + 20, curY);
    
    curY += 30;
    ctx.fillStyle = cMuted; ctx.font = 'bold 14px sans-serif';
    ctx.fillText('📅 Date: ' + fmt(report.date), pad + 20, curY);
    ctx.textAlign = 'right';
    ctx.fillText('⏰ Generated: ' + (report.generatedTime || 'N/A'), pad + cardW - 20, curY);
    curY += 30;

    groupsArr.forEach(function(g){
       ctx.fillStyle = 'rgba(99, 102, 241, 0.1)'; 
       ctx.beginPath(); ctx.roundRect(pad + 10, curY, cardW - 20, 44, 8); ctx.fill();
       
       ctx.fillStyle = cBrand; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
       ctx.fillText('STYLE: ' + g.style, pad + 20, curY + 27);
       if(g.color) {
         ctx.fillStyle = cAmber; ctx.textAlign = 'right'; ctx.font = 'bold 13px sans-serif';
         ctx.fillText('● ' + g.color, pad + cardW - 25, curY + 27);
       }
       curY += 44;

       // Removed PCS from Image Table Header
       ctx.fillStyle = cMuted; ctx.font = 'bold 11px sans-serif';
       ctx.textAlign = 'left'; ctx.fillText('Size', pad + 20, curY + 20);
       ctx.textAlign = 'center'; ctx.fillText('Carton', pad + cardW * 0.5, curY + 20);
       ctx.textAlign = 'right'; ctx.fillText('Pack', pad + cardW - 20, curY + 20);
       curY += 30;
       
       var tC=0,tPk=0;
       Object.keys(g.sizes).forEach(function(sz){
         var sd = g.sizes[sz];
         tC+=sd.c; tPk+=sd.pk;
         ctx.fillStyle = cText; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(sz, pad + 20, curY + 20);
         // Removed PCS from Image Table Body
         ctx.fillStyle = cGreen; ctx.textAlign = 'center'; ctx.fillText(sd.c, pad + cardW * 0.5, curY + 20);
         ctx.fillStyle = cAmber; ctx.textAlign = 'right'; ctx.fillText(sd.pk, pad + cardW - 20, curY + 20);
         
         ctx.beginPath(); ctx.moveTo(pad + 20, curY + 30); ctx.lineTo(pad + cardW - 20, curY + 30);
         ctx.strokeStyle = cLine; ctx.lineWidth = 1; ctx.stroke();
         curY += 40;
       });

       // Removed PCS from Image Total Row
       ctx.fillStyle = cText; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Total', pad + 20, curY + 20);
       ctx.textAlign = 'center'; ctx.fillText(tC, pad + cardW * 0.5, curY + 20);
       ctx.textAlign = 'right'; ctx.fillText(tPk, pad + cardW - 20, curY + 20);
       
       curY += 50;
    });

    canvas.toBlob(function(blob) {
      if (!blob) throw new Error('Blob failed');
      var file = new File([blob], 'Daily-Report-' + report.date + '.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Report ' + report.date })
        .then(function() { btn.innerHTML = oldText; btn.disabled = false; })
        .catch(function() { downloadImage(blob, report.date); btn.innerHTML = oldText; btn.disabled = false; });
      } else {
        downloadImage(blob, report.date); btn.innerHTML = oldText; btn.disabled = false;
      }
    }, 'image/png');

  } catch(err) {
    console.error(err); alert('Error creating image'); btn.innerHTML = oldText; btn.disabled = false;
  }
};

/* --- Existing Share (For Single History Card) --- */
function generateAndShare(record, btn) {
  var oldText = btn.textContent;
  btn.textContent = '...'; btn.disabled = true;
  try {
    var width = 540; var pad = 16; var cardW = width - pad * 2;
    var style = getComputedStyle(document.body);
    var cBg = style.getPropertyValue('--bg').trim() || '#f3f5fc';
    var cSurface = style.getPropertyValue('--surface').trim() || '#ffffff';
    var cSurface2 = style.getPropertyValue('--surface-2').trim() || '#f5f7fd';
    var cText = style.getPropertyValue('--text').trim() || '#0d1120';
    var cMuted = style.getPropertyValue('--muted').trim() || '#7b849c';
    var cLine = style.getPropertyValue('--line').trim() || '#e7eaf4';
    var cBrand = style.getPropertyValue('--brand-ink').trim() || '#4f46e5';
    var cBrandSolid = style.getPropertyValue('--brand').trim() || '#6366f1';
    var cBrandSolid2 = style.getPropertyValue('--brand-2').trim() || '#a855f7';
    var cGreen = style.getPropertyValue('--green').trim() || '#0ea5a3';
    var cAmber = style.getPropertyValue('--amber').trim() || '#e08b0b';

    var dummyCtx = document.createElement('canvas').getContext('2d');
    dummyCtx.font = 'bold 12px sans-serif';
    var serialTxt = '#' + record.serial;
    var serialW = dummyCtx.measureText(serialTxt).width + 20;
    var currentX = pad + 15 + serialW + 12; var currentY = pad + 30;
    var chipH = 28; var chipSpacing = 6; var rowSpacing = 8;
    var chipsToDraw = [];
    if (record.sty) chipsToDraw.push({label:'Style:', val:record.sty, isColor:false});
    if (record.po) chipsToDraw.push({label:'PO:', val:record.po, isColor:false});
    if (record.ord) chipsToDraw.push({label:'OP:', val:record.ord, isColor:false});
    if (record.buyer) chipsToDraw.push({label:'Buyer:', val:record.buyer, isColor:false});
    if (record.country) chipsToDraw.push({label:'Country:', val:record.country, isColor:false});
    if (record.color) chipsToDraw.push({label:record.color, val:'', isColor:true});

    chipsToDraw.forEach(function(c) {
        var text = c.label + (c.val ? ' ' + c.val : '');
        c.w = dummyCtx.measureText(text).width + 16 + (c.isColor ? 14 : 0);
        if (currentX + c.w > width - pad - 15) { currentX = pad + 15; currentY += chipH + rowSpacing; }
        c.x = currentX; c.y = currentY; currentX += c.w + chipSpacing;
    });

    var tableStartY = currentY + chipH + 20; var rowH = 44; var tableHeadH = 40;
    var totalH = tableStartY + tableHeadH + (record.rows.length * rowH) + 30;
    var canvas = document.createElement('canvas');
    var dpr = window.devicePixelRatio || 2;
    canvas.width = width * dpr; canvas.height = totalH * dpr;
    var ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);

    ctx.fillStyle = cBg; ctx.fillRect(0, 0, width, totalH);
    ctx.fillStyle = cSurface;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(pad, pad, cardW, totalH - pad*2, 20); else ctx.rect(pad, pad, cardW, totalH - pad*2);
    ctx.fill(); ctx.strokeStyle = cLine; ctx.lineWidth = 1; ctx.stroke();

    var topY = pad + 30;
    ctx.font = 'bold 13px sans-serif';
    var grad = ctx.createLinearGradient(pad + 15, topY - 14, pad + 15 + serialW, topY + 12);
    grad.addColorStop(0, cBrandSolid); grad.addColorStop(1, cBrandSolid2);
    ctx.fillStyle = grad;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(pad + 15, topY - 14, serialW, 26, 7); else ctx.rect(pad + 15, topY - 14, serialW, 26);
    ctx.fill();

    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.fillText(serialTxt, pad + 15 + serialW/2, topY + 4);
    ctx.font = '13px sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = cMuted;
    ctx.fillText(fmt(record.date) + ' · ' + record.time, pad + 15 + serialW + 12, topY + 2);

    chipsToDraw.forEach(function(c) {
        ctx.fillStyle = cSurface2; ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(c.x, c.y - 14, c.w, chipH, 7); else ctx.rect(c.x, c.y - 14, c.w, chipH);
        ctx.fill(); ctx.strokeStyle = cLine; ctx.lineWidth = 1; ctx.stroke();
        if (c.isColor) { ctx.fillStyle = cAmber; ctx.beginPath(); ctx.arc(c.x + 10, c.y, 3.5, 0, Math.PI*2); ctx.fill(); }
        ctx.fillStyle = c.isColor ? cAmber : cText; ctx.textAlign = 'left'; ctx.font = 'bold 12px sans-serif';
        var text = c.label + (c.val ? ' ' + c.val : '');
        ctx.fillText(text, c.x + (c.isColor ? 18 : 8), c.y + 4);
    });

    var tY = tableStartY;
    ctx.fillStyle = cSurface2; ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(pad + 10, tY - 18, cardW - 20, 32, 8); else ctx.rect(pad + 10, tY - 18, cardW - 20, 32);
    ctx.fill(); ctx.font = 'bold 11px sans-serif'; ctx.fillStyle = cMuted;
    
    var c1 = pad + 22; var c2 = pad + cardW * 0.42; var c3 = pad + cardW * 0.68; var c4 = pad + cardW - 22;
    ctx.textAlign = 'left'; ctx.fillText('Size', c1, tY + 2);
    ctx.textAlign = 'center'; ctx.fillText('Carton', c2, tY + 2); ctx.fillText('Pack', c3, tY + 2);
    ctx.textAlign = 'right'; ctx.fillText('Left', c4, tY + 2);

    record.rows.forEach(function(r) {
      tY += rowH; ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'left'; ctx.fillStyle = cText; ctx.fillText(r.n, c1, tY);
      ctx.textAlign = 'center'; ctx.fillStyle = cGreen; ctx.fillText(r.c, c2, tY);
      ctx.fillStyle = cBrand; ctx.fillText(r.p, c3, tY);
      ctx.textAlign = 'right'; ctx.fillStyle = cAmber; ctx.fillText(r.r, c4, tY);
      ctx.beginPath(); ctx.moveTo(c1, tY + 14); ctx.lineTo(c4, tY + 14); ctx.strokeStyle = cLine; ctx.lineWidth = 1; ctx.stroke();
    });

    tY += rowH; ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'left'; ctx.fillStyle = cText; ctx.fillText('Total', c1, tY);
    ctx.textAlign = 'center'; ctx.fillText(record.tot.c, c2, tY); ctx.fillText(record.tot.p, c3, tY);
    ctx.textAlign = 'right'; ctx.fillText(record.tot.r, c4, tY);

    canvas.toBlob(function(blob) {
      if (!blob) throw new Error('Blob failed');
      var file = new File([blob], 'Carton-Record-' + record.serial + '.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Carton #' + record.serial })
        .then(function() { btn.textContent = oldText; btn.disabled = false; })
        .catch(function() { downloadImage(blob, record.serial); btn.textContent = oldText; btn.disabled = false; });
      } else {
        downloadImage(blob, record.serial); btn.textContent = oldText; btn.disabled = false;
      }
    }, 'image/png');
  } catch (err) {
    console.error(err); alert('Image creation failed.'); btn.textContent = oldText; btn.disabled = false;
  }
}

function downloadImage(blob, identifier) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = 'Record-' + identifier + '.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* --- Init & Theme --- */
var TK='carton_theme_v1',root=document.documentElement;
function sysDark(){return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches}
function eff(){var t=root.getAttribute('data-theme');return t||(sysDark()?'dark':'light')}
function syncTheme(){
  var b=$('theme');if(!b)return;
  var d=eff()==='dark';
  b.textContent=d?'☀️':'🌙';
}
$('theme').onclick=function(){
  var next=eff()==='dark'?'light':'dark';
  root.setAttribute('data-theme',next);
  try{localStorage.setItem(TK,next)}catch(e){}
  var m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute('content',next==='dark'?'#080a12':'#6366f1');
  syncTheme();
};
(function(){
  try{var t=localStorage.getItem(TK);if(t)root.setAttribute('data-theme',t)}catch(e){}
  syncTheme();
  if(window.matchMedia){
    var mq=window.matchMedia('(prefers-color-scheme: dark)');
    var h=function(){if(!root.getAttribute('data-theme'))syncTheme()};
    if(mq.addEventListener)mq.addEventListener('change',h);else if(mq.addListener)mq.addListener(h);
  }
})();

checkAutoReport();
