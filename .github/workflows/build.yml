name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Set app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import glob, os
          src = Image.open('icon-only.png').convert('RGBA')
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          res = 'android/app/src/main/res'
          for d, s in sizes.items():
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              img = src.resize((s, s), Image.LANCZOS)
              for n in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                  img.save(f'{folder}/{n}')
          for f in glob.glob(f'{res}/mipmap-anydpi*/*'):
              os.remove(f)
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: carton-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
